name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Reads lean-toolchain and lake-manifest.json; downloads the Mathlib cache.
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
      - name: Check public API and excluded parameter regimes
        run: |
          lake env lean test/ModelChecks.lean
          lake env lean test/PlanarNetworkChecks.lean
