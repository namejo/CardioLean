name = "cardiolean"
version = "0.1.0"
defaultTargets = ["CardioLean"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
# Mathlib v4.35.0, matching lean-toolchain. The manifest also locks transitive dependencies.
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "CardioLean"
